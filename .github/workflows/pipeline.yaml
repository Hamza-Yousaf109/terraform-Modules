name: Terraform Multi-Environment CI

on:
  push:
    paths:
      - "environments/dev/**"
      - "environments/stag/**"
      - "environments/prod/**"

jobs:

  detect:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.setenv.outputs.env }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed environment
        id: setenv
        run: |
          # Try to compare with previous commit, fallback if first commit
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            CHANGES=$(git diff --name-only HEAD^ HEAD)
          else
            # First commit - check all staged/committed files
            CHANGES=$(git diff --name-only --cached HEAD)
            if [ -z "$CHANGES" ]; then
              CHANGES=$(git ls-files)
            fi
          fi
          
          if echo "$CHANGES" | grep -q "environments/dev"; then
            echo "env=dev" >> $GITHUB_OUTPUT
          elif echo "$CHANGES" | grep -q "environments/stag"; then
            echo "env=stag" >> $GITHUB_OUTPUT
          elif echo "$CHANGES" | grep -q "environments/prod"; then
            echo "env=prod" >> $GITHUB_OUTPUT
          else
            echo "env=none" >> $GITHUB_OUTPUT
          fi

  terraform:
    needs: detect
    if: needs.detect.outputs.env != 'none'
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: environments/${{ needs.detect.outputs.env }}
        run: terraform init

      - name: Terraform Validate
        working-directory: environments/${{ needs.detect.outputs.env }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: environments/${{ needs.detect.outputs.env }}
        run: terraform plan -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ needs.detect.outputs.env }}
          path: environments/${{ needs.detect.outputs.env }}/tfplan
          retention-days: 1

  deploy:
    needs: [detect, terraform]
    if: needs.detect.outputs.env != 'none'
    runs-on: ubuntu-latest
    
    environment:
      name: ${{ needs.detect.outputs.env }}
      url: https://console.aws.amazon.com

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ needs.detect.outputs.env }}
          path: environments/${{ needs.detect.outputs.env }}

      - name: Terraform Apply
        working-directory: environments/${{ needs.detect.outputs.env }}
        run: terraform apply -auto-approve tfplan