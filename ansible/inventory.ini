[jenkins_servers]
# Dynamic inventory - generated by terraform_to_ansible.py
# Format: hostname ansible_host=IP ansible_user=ubuntu
# Example:
# test-1 ansible_host=54.123.45.67 ansible_user=ubuntu

[jenkins_servers:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_connection=ssh
ansible_port=22
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
